<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',Arial,sans-serif}
html,body{width:100%;height:100%;background:#080312}
.wrap{min-height:100dvh;display:flex;justify-content:center;align-items:center;padding:14px;background:radial-gradient(600px at 50% -10%,#3a1d95 0%,#0e0628 55%,#080312 100%)}
.card{width:100%;max-width:385px;background:linear-gradient(180deg,rgba(40,20,90,.9),rgba(18,8,48,.98));border:2px solid transparent;background-clip:padding-box;position:relative;border-radius:36px;padding:22px 18px 18px;text-align:center;box-shadow:0 0 0 1.5px #a855f7,0 0 60px rgba(168,85,247,.55),inset 0 0 30px rgba(255,255,255,.05)}
.card::before{content:'';position:absolute;inset:-2px;border-radius:36px;padding:2px;background:linear-gradient(90deg,#ffcc00,#a855f7,#ff0a54);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.top{display:flex;justify-content:space-between;align-items:center}
.top img{width:52px;height:52px;filter:drop-shadow(0 0 12px gold) drop-shadow(0 0 20px rgba(255,215,0,.6))}
.top.title{font-size:32px;font-weight:900;letter-spacing:.5px;background:linear-gradient(180deg,#ffe27a 0%,#ffcc00 50%,#ffb700 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 12px rgba(255,204,0,.8))}
.dp{position:relative;width:196px;height:196px;margin:14px auto 18px}
.dp img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:5px solid #ffcc00;box-shadow:0 0 25px rgba(255,204,0,.7),0 0 50px rgba(168,85,247,.4)}
.verified{position:absolute;right:0;bottom:14px;width:44px;height:44px;background:radial-gradient(circle at 30% 30%,#ffe27a,#ffcc00 60%,#ff9900);border:3px solid #1a0f3d;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;box-shadow:0 4px 15px rgba(0,0,0,.4)}
.tag{display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;font-weight:800;color:#ffd84d;letter-spacing:.3px;text-shadow:0 0 10px rgba(255,204,0,.6);margin-bottom:22px}
.tag img{width:22px;height:22px;filter:drop-shadow(0 0 6px gold)}
.btn{width:100%;display:flex;justify-content:center;align-items:center;gap:10px;padding:18px;border-radius:100px;font-weight:900;font-size:19px;color:#fff;text-decoration:none;background:linear-gradient(92deg,#ff104e 0%,#ff7a00 100%);box-shadow:0 8px 0 #9d0b30,0 15px 35px rgba(255,16,78,.5);transform:translateY(0);transition:.15s}
.btn:active{transform:translateY(4px);box-shadow:0 4px 0 #9d0b30,0 10px 20px rgba(255,16,78,.4)}
.btn img{width:30px;height:30px;filter:brightness(0) invert(1)}
.stats{display:flex;justify-content:space-between;margin-top:22px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:12px 6px}
.stat b{color:#ffcc00;font-size:21px;display:block;text-shadow:0 0 10px rgba(255,204,0,.5)}
.stat span{font-size:9.5px;color:rgba(255,255,255,.6);font-weight:700;letter-spacing:.5px}
.trust{margin-top:14px;display:flex;align-items:center;justify-content:center;gap:8px;color:rgba(255,255,255,.6);font-size:11.5px;font-weight:600}
.trust img{width:18px;height:18px}
</style>
